basePath: /
definitions:
  github_com_Vanselyn_vsb-server_internal_model_permission.User:
    properties:
      account:
        type: string
      createdAt:
        type: string
      email:
        type: string
      phone:
        type: string
      updatedAt:
        type: string
      userId:
        type: string
      username:
        type: string
    type: object
  github_com_Vanselyn_vsb-server_pkg_response.PageData:
    properties:
      list:
        description: 列表
      pageIndex:
        description: 页码
        type: integer
      pageSize:
        description: 每页条数
        type: integer
      total:
        description: 总条数
        type: integer
    type: object
  github_com_Vanselyn_vsb-server_pkg_response.Response:
    properties:
      code:
        description: 状态码
        type: integer
      data:
        description: 数据
      message:
        description: 消息
        type: string
    type: object
  internal_handler_permission_user.EditRequest:
    properties:
      account:
        type: string
      email:
        type: string
      password:
        type: string
      phone:
        type: string
      username:
        type: string
    type: object
  internal_handler_permission_user.LoginRequest:
    properties:
      account:
        type: string
      password:
        type: string
    type: object
  internal_handler_permission_user.LoginResponse:
    properties:
      token:
        type: string
      user: {}
    type: object
  internal_handler_permission_user.RegisterRequest:
    properties:
      account:
        type: string
      email:
        type: string
      password:
        type: string
      phone:
        type: string
      username:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: VSB 服务端 API 文档
  title: VSB Server API
  version: "1.0"
paths:
  /api/permission/user/create:
    post:
      consumes:
      - application/json
      description: 创建新用户，需要 Bearer Token
      parameters:
      - description: 注册信息
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler_permission_user.RegisterRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 创建成功
          schema:
            allOf:
            - $ref: '#/definitions/github_com_Vanselyn_vsb-server_pkg_response.Response'
            - properties:
                data:
                  $ref: '#/definitions/github_com_Vanselyn_vsb-server_internal_model_permission.User'
              type: object
        "400":
          description: 参数错误或账号已存在
          schema:
            $ref: '#/definitions/github_com_Vanselyn_vsb-server_pkg_response.Response'
        "401":
          description: 未授权
          schema:
            $ref: '#/definitions/github_com_Vanselyn_vsb-server_pkg_response.Response'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/github_com_Vanselyn_vsb-server_pkg_response.Response'
      security:
      - ApiKeyAuth: []
      summary: 创建用户
      tags:
      - 用户管理
  /api/permission/user/delete/{userId}:
    delete:
      description: 根据 userId 删除用户，需要 Bearer Token
      parameters:
      - description: 用户 ID
        in: path
        name: userId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 删除成功
          schema:
            $ref: '#/definitions/github_com_Vanselyn_vsb-server_pkg_response.Response'
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/github_com_Vanselyn_vsb-server_pkg_response.Response'
        "401":
          description: 未授权
          schema:
            $ref: '#/definitions/github_com_Vanselyn_vsb-server_pkg_response.Response'
        "404":
          description: 用户不存在
          schema:
            $ref: '#/definitions/github_com_Vanselyn_vsb-server_pkg_response.Response'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/github_com_Vanselyn_vsb-server_pkg_response.Response'
      security:
      - ApiKeyAuth: []
      summary: 删除用户
      tags:
      - 用户管理
  /api/permission/user/edit/{userId}:
    put:
      consumes:
      - application/json
      description: 根据 userId 更新用户信息，需要 Bearer Token
      parameters:
      - description: 用户 ID
        in: path
        name: userId
        required: true
        type: string
      - description: 更新信息
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler_permission_user.EditRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 更新成功
          schema:
            $ref: '#/definitions/github_com_Vanselyn_vsb-server_pkg_response.Response'
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/github_com_Vanselyn_vsb-server_pkg_response.Response'
        "401":
          description: 未授权
          schema:
            $ref: '#/definitions/github_com_Vanselyn_vsb-server_pkg_response.Response'
        "404":
          description: 用户不存在
          schema:
            $ref: '#/definitions/github_com_Vanselyn_vsb-server_pkg_response.Response'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/github_com_Vanselyn_vsb-server_pkg_response.Response'
      security:
      - ApiKeyAuth: []
      summary: 编辑用户
      tags:
      - 用户管理
  /api/permission/user/list:
    get:
      consumes:
      - application/json
      description: 分页获取用户列表，需要 Bearer Token
      parameters:
      - description: 页码，默认1
        in: query
        name: pageIndex
        type: integer
      - description: 每页数量，默认20
        in: query
        name: pageSize
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 用户列表
          schema:
            allOf:
            - $ref: '#/definitions/github_com_Vanselyn_vsb-server_pkg_response.Response'
            - properties:
                data:
                  $ref: '#/definitions/github_com_Vanselyn_vsb-server_pkg_response.PageData'
              type: object
        "401":
          description: 未授权
          schema:
            $ref: '#/definitions/github_com_Vanselyn_vsb-server_pkg_response.Response'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/github_com_Vanselyn_vsb-server_pkg_response.Response'
      security:
      - ApiKeyAuth: []
      summary: 获取用户列表
      tags:
      - 用户管理
  /api/permission/user/login:
    post:
      consumes:
      - application/json
      description: 使用用户名和密码登录，返回 JWT token 和用户信息
      parameters:
      - description: 登录信息
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler_permission_user.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 登录成功
          schema:
            allOf:
            - $ref: '#/definitions/github_com_Vanselyn_vsb-server_pkg_response.Response'
            - properties:
                data:
                  $ref: '#/definitions/internal_handler_permission_user.LoginResponse'
              type: object
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/github_com_Vanselyn_vsb-server_pkg_response.Response'
        "401":
          description: 用户名或密码错误
          schema:
            $ref: '#/definitions/github_com_Vanselyn_vsb-server_pkg_response.Response'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/github_com_Vanselyn_vsb-server_pkg_response.Response'
      summary: 用户登录
      tags:
      - 用户管理
securityDefinitions:
  ApiKeyAuth:
    description: Bearer JWT token，格式：Bearer {token}
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
